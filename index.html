<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hay cosas que nunca pude decirte</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #050505;
      color: #f4f0e9;
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }

    .pantalla {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px;
      background:
        radial-gradient(
          circle at center,
          #171513 0%,
          #0b0a0a 50%,
          #040404 100%
        );
      transition: opacity 1.6s ease;
    }

    .oculta {
      opacity: 0;
      pointer-events: none;
    }

    #introduccion {
      z-index: 20;
      text-align: center;
    }

    .intro-contenido {
      width: min(820px, 100%);
    }

    #introTexto {
      min-height: 260px;
      display: flex;
      justify-content: center;
      align-items: center;
      white-space: pre-line;
      font-size: clamp(1.7rem, 5vw, 3.7rem);
      line-height: 1.55;
      letter-spacing: 0.015em;
      opacity: 0;
      transition:
        opacity 1.4s ease,
        transform 1.4s ease;
      transform: translateY(15px);
    }

    #introTexto.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #introTexto.pequeno {
      font-size: clamp(1.35rem, 4vw, 2.5rem);
    }

    #botonComenzar {
      margin-top: 35px;
      padding: 14px 38px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      background: transparent;
      color: #f4f0e9;
      font-family: inherit;
      font-size: 1rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0;
      transform: translateY(15px);
      transition:
        opacity 1.5s ease,
        transform 1.5s ease,
        background 0.3s ease,
        color 0.3s ease;
    }

    #botonComenzar.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #botonComenzar:hover {
      background: #f4f0e9;
      color: #080808;
    }

    #historia {
      z-index: 10;
      text-align: center;
      opacity: 0;
    }

    #historia.visible {
      opacity: 1;
    }

    .historia-contenido {
      width: min(900px, 100%);
    }

#texto {
  width: 100%;
  min-height: 300px;
  display: block;
  text-align: center;
  white-space: pre-line;
  padding-top: 80px;
  padding-left: 15px;
  padding-right: 15px;
  font-size: clamp(1.45rem, 4.4vw, 3rem);
  line-height: 1.65;
  letter-spacing: 0.012em;
  transition: opacity 0.9s ease;
  text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45);
}
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      margin-left: 6px;
      background: #f4f0e9;
      vertical-align: -0.08em;
      animation: parpadear 0.8s infinite;
    }

    #nombreCancion {
      position: fixed;
      left: 24px;
      bottom: 22px;
      z-index: 30;
      opacity: 0;
      transform: translateY(10px);
      transition:
        opacity 1.8s ease,
        transform 1.8s ease;
      font-family: Arial, sans-serif;
      text-align: left;
      pointer-events: none;
    }

    #nombreCancion.visible {
      opacity: 0.55;
      transform: translateY(0);
    }

    #nombreCancion strong {
      display: block;
      font-size: 0.82rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 500;
    }

    #nombreCancion span {
      display: block;
      margin-top: 4px;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      opacity: 0.75;
    }

    #final {
      z-index: 25;
      text-align: center;
      opacity: 0;
    }

    #final.visible {
      opacity: 1;
    }

    .final-contenido {
      width: min(850px, 100%);
    }

    .final-linea {
      opacity: 0;
      transform: translateY(15px);
      font-size: clamp(1.8rem, 5.5vw, 4rem);
      line-height: 1.5;
    }

    .final-linea.activa {
      animation: aparecer 2s ease forwards;
    }

    .final-linea.importante {
      margin-top: 22px;
      font-style: italic;
    }

    audio {
      display: none;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes parpadear {
      0%,
      45% {
        opacity: 1;
      }

      46%,
      100% {
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      .pantalla {
        padding: 24px;
      }

      #introTexto {
        min-height: 330px;
      }

      #texto {
        min-height: 390px;
        line-height: 1.58;
      }

      #nombreCancion {
        left: 18px;
        bottom: 16px;
      }

      #botonComenzar {
        margin-top: 26px;
      }
    }
  </style>
</head>

<body>

  <section id="introduccion" class="pantalla">
    <div class="intro-contenido">
      <div id="introTexto"></div>

      <button id="botonComenzar">
        Comenzar
      </button>
    </div>
  </section>

  <section id="historia" class="pantalla oculta">
    <div class="historia-contenido">
      <div id="texto"></div>
    </div>
  </section>

  <section id="final" class="pantalla oculta">
    <div class="final-contenido">
      <p id="final1" class="final-linea">
        Y al día siguiente...
      </p>

      <p id="final2" class="final-linea">
        lo único que pude hacer...
      </p>

      <p id="final3" class="final-linea importante">
        fue seguir pensando en ti.
      </p>
    </div>
  </section>

  <div id="nombreCancion">
    <strong>♪ Robbers</strong>
    <span>The 1975</span>
  </div>

  <audio id="audio" preload="auto">
    <source src="./cancion.mp3.mp3" type="audio/mpeg">
  </audio>

  <script>
    const introduccion = document.getElementById("introduccion");
    const historia = document.getElementById("historia");
    const final = document.getElementById("final");

    const introTexto = document.getElementById("introTexto");
    const botonComenzar = document.getElementById("botonComenzar");

    const texto = document.getElementById("texto");
    const audio = document.getElementById("audio");
    const nombreCancion = document.getElementById("nombreCancion");

    const introduccionFrases = [
      {
        texto: "Si estás leyendo esto...",
        duracion: 3000,
        pequeno: false
      },
      {
        texto: "...es porque decidiste llegar hasta aquí.",
        duracion: 2800,
        pequeno: false
      },
      {
        texto: "Y eso significa mucho para mí.",
        duracion: 3000,
        pequeno: false
      },
      {
        texto: "Hay recuerdos...\n\n...que nunca dejan de existir.",
        duracion: 3500,
        pequeno: false
      },
      {
        texto: "Hay personas...\n\n...que, aunque pase el tiempo,\nnunca terminan de irse.",
        duracion: 4200,
        pequeno: false
      },
      {
        texto: "Y hay palabras...\n\n...que simplemente jamás encontraron\nel momento correcto para ser dichas.",
        duracion: 4800,
        pequeno: false
      },
      {
        texto: "No escribí esto esperando cambiar tu decisión.",
        duracion: 3500,
        pequeno: true
      },
      {
        texto: "Lo escribí...\n\n...porque no quería que el silencio\nfuera lo último que quedara entre nosotros.",
        duracion: 5000,
        pequeno: true
      },
      {
        texto: "Solo quiero pedirte una cosa.",
        duracion: 3000,
        pequeno: true
      },
      {
        texto: "Si decides continuar...",
        duracion: 3000,
        pequeno: true
      },
      {
        texto: "Prométeme que llegarás hasta el final.",
        duracion: 5000,
        pequeno: false
      }
    ];

    const fragmentos = [
      `No sé qué tan difícil pudo ser...

pero lo fue.`,

      `Conté días y noches,
semanas y meses.

El tiempo que no tenía
y el tiempo que me sobraba.

Todo para ti.`,

      `Nunca dejé de pensar en ti.

Y si me pongo a reflexionar...

nunca dejé de extrañarte.`,

      `Porque desde ese primer beso
en nuestra ciudad...

y aquella tarde
en aquel hotel de playa...

no he parado de quererte.`,

      `Decirte que me gustabas...

y saber que a ti
te pasaba lo mismo...

fue la mejor sensación
de aquel año.`,

      `Pero creo que todo
comenzó mucho antes.`,

      `Cuando te vi en aquella feria,
cuando éramos niños
y yo estaba con mi hermana.`,

      `Andrea.`,

      `Desde entonces
no pude olvidar ese nombre.`,

      `Quedó marcado
en mi piel
y en mi mente.`,

      `Antes te quería
de una forma especial...

de esa forma
en la que no quieres
a nadie más.`,

      `Pero ahora es diferente.`,

      `Ahora me siento perdido.

Completamente derrotado.`,

      `Porque ahora te amo.`,

      `Y creo que esta vez
no es igual...

porque esta vez siento
que a ti no te pasa lo mismo.`,

      `Lo logré.

Dejé atrás mis miedos,
mis pensamientos
y mis inseguridades.`,

      `Solté todo lo que pude
para darte
la mejor versión de mí.`,

      `Fui amoroso,
lindo
y detallista.`,

      `Quise tratarte bien.

Quise hacerte sentir
amada de una forma
que nunca olvidaras.`,

      `Pero no fue suficiente.`,

      `Después de todo eso...

decidiste mentirme
una y otra vez.`,

      `Incluso mientras
me veías llorar...

y mientras me decías
que no querías
verme así.`,

      `Salir de ahí
sintiéndome tan mierda...

y poner música...

fue peor.`,

      `¿Sabes lo que es gritar...

"¡Mierda!"

mientras lloras
a 140 kilómetros por hora?`,

      `¿Sabes lo que es
sentir que el grito
se queda sin aire...

y que lo único
que sale después
son más lágrimas?`,

      `Pasar por todo eso...

para descubrir
que esa noche
dormiste en llamada
con otra persona.`
    ];

    const velocidadEscritura = 42;
    const pausaEntreFragmentos = 2100;

    function esperar(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function mostrarIntro() {
      await esperar(3000);

      for (const frase of introduccionFrases) {
        introTexto.classList.remove("visible");
        await esperar(900);

        introTexto.textContent = frase.texto;
        introTexto.classList.toggle("pequeno", frase.pequeno);

        introTexto.classList.add("visible");

        await esperar(frase.duracion);

        introTexto.classList.remove("visible");
        await esperar(1100);
      }

      introTexto.textContent = "";
      botonComenzar.classList.add("visible");
    }

    async function fadeInAudio() {
      audio.volume = 0;

      try {
        await audio.play();

        const objetivo = 0.58;
        const pasos = 35;
        const incremento = objetivo / pasos;

        for (let i = 0; i < pasos; i++) {
          audio.volume = Math.min(objetivo, audio.volume + incremento);
          await esperar(120);
        }
      } catch (error) {
        console.log("No se pudo iniciar el audio:", error);
      }
    }

    async function escribir(textoCompleto) {
      texto.innerHTML = "";

      const contenido = document.createElement("span");
      const cursor = document.createElement("span");

      cursor.className = "cursor";

      texto.appendChild(contenido);
      texto.appendChild(cursor);

      for (const caracter of textoCompleto) {
        contenido.textContent += caracter;

        let retraso = velocidadEscritura;

        if (caracter === ".") {
          retraso = 250;
        } else if (
          caracter === "," ||
          caracter === ":" ||
          caracter === ";"
        ) {
          retraso = 120;
        } else if (caracter === "\n") {
          retraso = 170;
        }

        await esperar(retraso);
      }

      await esperar(pausaEntreFragmentos);

      texto.style.opacity = "0";

      await esperar(900);

      texto.style.opacity = "1";
    }

    async function comenzarHistoria() {
      botonComenzar.disabled = true;

      introduccion.classList.add("oculta");

      fadeInAudio();

      await esperar(1800);

      nombreCancion.classList.add("visible");

      await esperar(4000);

      historia.classList.remove("oculta");

      await esperar(100);

      historia.classList.add("visible");

      for (const fragmento of fragmentos) {
        await escribir(fragmento);
      }

      historia.classList.add("oculta");
      nombreCancion.classList.remove("visible");

      await esperar(1700);

      mostrarFinal();
    }

    async function mostrarFinal() {
      final.classList.remove("oculta");

      await esperar(100);

      final.classList.add("visible");

      const final1 = document.getElementById("final1");
      const final2 = document.getElementById("final2");
      const final3 = document.getElementById("final3");

      final1.classList.add("activa");

      await esperar(3000);

      final2.classList.add("activa");

      await esperar(3200);

      final3.classList.add("activa");
    }

    botonComenzar.addEventListener("click", comenzarHistoria);

    mostrarIntro();
  </script>

</body>
</html>
